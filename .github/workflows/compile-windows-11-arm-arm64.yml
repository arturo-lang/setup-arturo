name: Compile

on:
    push:
        paths-ignore:
            - 'LICENSE'
            - '*.md'
        branches:
            - main
    pull_request:
        paths-ignore:
            - 'LICENSE'
            - '*.md'
    workflow_dispatch:

concurrency: 
    group: ${{ github.workflow }}-windows-11-arm-arm64-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows-11-arm-arm64:
        runs-on: windows-11-arm
        steps:
            - uses: actions/checkout@v6
            
            - name: Install Arturo
              uses: ./
              with: 
                do: compile
                arch: arm64
                src: windows-arm64 # TEMPORARY: until arturo-lang/arturo#2522 is merged
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Test Arturo
              run: |
                tests/verify.sh windows arm64 full
              shell: "msys2 {0}"
